name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: 编译并打包未签名 ipa
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验工具链（必须 iOS 26+ SDK）
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          case "$SDK" in
            26.*|27.*) echo "SDK 可用" ;;
            *) echo "::error::需要 iOS 26 及以上的 SDK，当前是 $SDK"; exit 1 ;;
          esac

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（关闭签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Xiaoman.xcodeproj \
            -scheme Xiaoman \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 运行单元测试（失败不阻断打包）
        continue-on-error: true
        run: |
          set -o pipefail
          # 从 xcodebuild 自己列出的 destination 里挑一个 iOS 模拟器，避免硬编码机型
          DEVICE_ID=$(xcodebuild -project Xiaoman.xcodeproj -scheme Xiaoman -showdestinations 2>/dev/null \
            | grep -E "platform:iOS Simulator" | head -1 \
            | sed -E 's/.*id:([^,}]+).*/\1/' | tr -d ' ')
          if [ -z "$DEVICE_ID" ]; then
            echo "没有可用的模拟器，跳过单元测试"
            exit 0
          fi
          echo "模拟器: $DEVICE_ID"
          xcodebuild test \
            -project Xiaoman.xcodeproj \
            -scheme Xiaoman \
            -configuration Debug \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tail -200

      - name: 打包成 ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Xiaoman.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "找不到 $APP_PATH"
            find build/Build/Products -maxdepth 3 -name "*.app" || true
            exit 1
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/Xiaoman.app/_CodeSignature
          zip -qry -X "Xiaoman-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "Xiaoman-unsigned.ipa"
          unzip -l "Xiaoman-unsigned.ipa" | head -20

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: Xiaoman-unsigned-ipa
          path: Xiaoman-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
